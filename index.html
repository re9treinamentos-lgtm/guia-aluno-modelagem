<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia do Aluno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="base.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="side-scroll">
      <a class="brand" id="brand" href="#inicio"></a>
      <div class="side-label" id="sideLabel"></div>
      <div class="side-hint">Encontre uma aula ou assunto</div>
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8f97b0" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar no guia..." autocomplete="off"><span class="kbd">/</span></label>
      <a class="nav-home" id="homeLink" href="#inicio"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Comece por aqui</a>
      <nav id="nav"></nav>
    </div>
    <div class="side-foot"><div class="userbox" id="userBox" style="display:none"></div><div class="side-prog" id="sideProg"></div><div id="sideFootNote" style="font-size:11.5px;color:#6f7896;margin-top:8px;text-align:center"></div></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Abrir menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="crumb" id="crumb"></div>
      <div class="top-actions">
        <a class="tlink" id="topQuadro" href="#quadro"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="m15 15 5 5m0-5-5 5"/></svg><span class="lbl">Quadro de padrões</span></a>
        <a class="tlink" id="topMat" href="#materiais"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lbl">Materiais</span></a>
        <a class="tbtn" id="topEx" href="#exercicios"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg><span class="lbl">Meu desempenho</span></a>
      </div>
    </header>
    <main class="view" id="view"><div class="loading">Carregando o guia…</div></main>
  </div>
</div>
<script src="tema.js"></script>
<script src="nuvem.js"></script>
<script src="app.js"></script>
</body>
</html>
